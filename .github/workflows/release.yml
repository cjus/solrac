name: Release

# Tag-triggered. Tagging is the only way to publish; merge-to-main does not
# release. Workflow:
#
#   git tag v0.3.0
#   git push --tags
#
# CI then runs typecheck + tests, builds all four target binaries on a single
# Linux runner via `bun build --compile --target=...` (Bun cross-compiles for
# free), and publishes the tarballs + sha256 sidecars to a GitHub Release named
# after the tag. install.sh's default `URL_BASE` resolves to the release's
# /latest/download/ alias.
#
# Bun pin: matches `bun-types` in package.json so the binary's snapshotted
# runtime equals the dev's Bun version. Bump both together.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write  # needed to create the GitHub Release + upload assets

# Opt into Node 24 for JavaScript-based actions (checkout, setup-node,
# setup-bun, action-gh-release, etc.). Node 20 is deprecated on GitHub
# runners — forced switch starts 2026-06-02, removal 2026-09-16. Setting
# the env var early lets us validate the new runtime before the forced
# migration. The release is unaffected by which Node runs the actions —
# the binary's snapshotted Bun runtime comes from the `bun-version` pin
# below, not from the runner's Node.
# See: https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - uses: oven-sh/setup-bun@v2
        with:
          # Pin matches `bun-types` in package.json so the snapshotted runtime
          # in the released binary equals what dev tests against.
          bun-version: "1.3.11"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: bun test

      - name: Build all targets
        # `bun build --compile` cross-compiles for darwin-arm64, darwin-x64,
        # linux-x64, linux-arm64 from a single Linux runner — no per-OS matrix
        # needed. scripts/build.ts produces dist/solrac-<target>.tar.gz plus
        # dist/solrac-<target>.tar.gz.sha256 for each target.
        run: npm run build:bin

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # Tag name comes from the trigger (refs/tags/v0.3.0 → v0.3.0).
          # GitHub auto-generates release notes from commits since the previous
          # tag; edit them after publish if needed.
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/solrac-*.tar.gz
            dist/solrac-*.tar.gz.sha256
